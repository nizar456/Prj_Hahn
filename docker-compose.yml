services:
  db:
    image: mysql:8.4
    container_name: task-db
    environment:
      MYSQL_DATABASE: taskdb
      MYSQL_ROOT_PASSWORD: nizar123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./Back-End
    container_name: task-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: nizar123
      SERVER_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Front-End
      args:
        VITE_API_BASE_URL: http://localhost:8087/api
    container_name: task-frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  db_data:
